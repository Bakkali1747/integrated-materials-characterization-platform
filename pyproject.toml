[project]
name = "microwave-absorption-analyzer"
version = "0.10.0"
description = "Local, traceable microwave absorption analysis"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# 仅启用语法错误、未定义/未使用名称和导入顺序；多语句风格规则不作为门禁。
select = ["E9", "F", "I"]
ignore = ["E501"]
