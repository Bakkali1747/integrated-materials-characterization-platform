[project]
name = "integrated-materials-characterization-platform"
version = "0.16.0"
description = "Local, sample-centered and traceable materials characterization platform"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 项目根目录下同时存在多个顶层包与 run_*.py 脚本，禁用自动发现，显式声明可安装内容。
[tool.setuptools]
py-modules = ["application_paths"]

[tool.setuptools.packages.find]
include = ["core*", "export*", "gui*", "plotting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# 仅启用语法错误、未定义/未使用名称和导入顺序；多语句风格规则不作为门禁。
select = ["E9", "F", "I"]
ignore = ["E501"]
